syntax = "proto3";
package artest.process.v0;
option optimize_for = LITE_RUNTIME;

// Experimental wire 0.1. Field numbers are independent of native ABI layouts.
message Envelope {
  uint32 major = 1;
  uint32 minor = 2;
  uint64 generation = 3;
  uint64 correlation = 4;
  uint64 parent = 5;
  oneof body {
    Hello hello = 10;
    Request request = 11;
    Response response = 12;
    Cancel cancel = 13;
    Event event = 14;
  }
}
message Hello {
  string extension_id = 1;
  string fingerprint = 2;
  bytes nonce = 3;
  bool acknowledged = 4;
}
enum Operation {
  OPERATION_UNSPECIFIED = 0;
  DESCRIBE = 1;
  CREATE = 2;
  INITIALIZE = 3;
  INVOKE = 4;
  SHUTDOWN = 5;
  DESTROY = 6;
  RESOLVE_SERVICE = 7;
  INVOKE_SERVICE = 8;
  RELEASE_SERVICE = 9;
  STOP = 10;
}
message Payload {
  string schema_id = 1;
  string json = 2;
}
message Request {
  Operation operation = 1;
  uint64 component = 2;
  string type_id = 3;
  string operation_id = 4;
  Payload payload = 5;
  uint64 remaining_ms = 6;
  bool has_deadline = 7;
}
enum Status {
  OK = 0;
  INVALID_ARGUMENT = 1;
  NOT_FOUND = 2;
  CANCELLED = 3;
  TIMED_OUT = 4;
  EXTENSION_FAILURE = 5;
  PROTOCOL_FAILURE = 6;
  HOST_FAILURE = 7;
}
message Response {
  Status status = 1;
  string diagnostic = 2;
  Payload payload = 3;
  uint64 handle = 4;
}
message Cancel { bool acknowledged = 1; }
message Event {
  uint32 severity = 1;
  string category = 2;
  string message = 3;
}
